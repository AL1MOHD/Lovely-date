<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>دعوة لرمله</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;600;700&family=Baloo+Bhaijaan+2:wght@400;600;700&display=swap">
<style>
/* Layout: a sealed love letter opens into a tilted sticker-style card; each question sits in a play area where wrong answers run away */
:root{
  --blush:#ffe3ec;
  --blush-2:#ffc9d9;
  --paper:#fffaf6;
  --berry:#d6336c;
  --ink:#5b1235;
  --muted:#9b5574;
  --butter:#ffd166;
  --display:"Marhey","Baloo Bhaijaan 2",Tahoma,sans-serif;
  --body:"Baloo Bhaijaan 2",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--blush);
  color:var(--ink);font-family:var(--body);
  padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ---------- envelope ---------- */
.env-wrap{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.env-to{font-family:var(--display);font-size:clamp(26px,7vw,34px);margin:0;line-height:1.4}
.env-to b{color:var(--berry)}
.env-hint{margin:0;color:var(--muted);font-size:15px}
.envelope{
  position:relative;width:min(280px,80vw);aspect-ratio:3/2;max-width:100%;
  border:3px solid var(--ink);border-radius:14px;background:var(--blush-2);
  box-shadow:0 6px 0 var(--ink);cursor:pointer;padding:0;
  perspective:800px;animation:bob 2.4s ease-in-out infinite;
}
.envelope:focus-visible{outline:3px dashed var(--berry);outline-offset:6px}
.env-flap{
  position:absolute;inset:-3px -3px auto -3px;height:62%;
  background:var(--berry);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .6s ease;border-radius:12px 12px 0 0;
}
.env-lines{position:absolute;inset:auto 0 0 0;height:100%;
  background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--ink) calc(50% - 1.5px),var(--ink) calc(50% + 1.5px),transparent calc(50% + 1.5px)) left bottom/50% 60% no-repeat,
             linear-gradient(to top left,transparent calc(50% - 1.5px),var(--ink) calc(50% - 1.5px),var(--ink) calc(50% + 1.5px),transparent calc(50% + 1.5px)) right bottom/50% 60% no-repeat;
  opacity:.35;border-radius:0 0 12px 12px}
.seal{
  position:absolute;left:50%;top:50%;translate:-50% -50%;width:62px;height:62px;border-radius:50%;
  background:var(--butter);border:3px solid var(--ink);display:grid;place-items:center;transition:opacity .3s;
}
.seal svg{width:30px;height:30px}
.envelope.open{animation:none}
.envelope.open .env-flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}

/* ---------- card ---------- */
.card{
  position:relative;z-index:1;width:100%;max-width:440px;
  background:var(--paper);border:3px solid var(--ink);border-radius:26px;
  box-shadow:8px 8px 0 var(--berry);
  padding:26px 20px 22px;text-align:center;rotate:-1deg;
}
.card.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6) translateY(40px)}to{transform:none}}
.sticker{position:absolute;width:46px;height:46px;animation:wiggle 3s ease-in-out infinite}
.sticker.a{top:-22px;left:-14px}
.sticker.b{bottom:-20px;right:-12px;width:38px;height:38px;animation-delay:-1.4s}
@keyframes wiggle{0%,100%{rotate:-10deg}50%{rotate:12deg}}
.to{font-family:var(--display);color:var(--berry);font-size:17px}
.steps{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
.steps svg{width:20px;height:20px;transition:transform .3s}
.steps svg path{fill:var(--blush-2);stroke:var(--ink);stroke-width:2.2}
.steps svg.on path{fill:var(--berry)}
.steps svg.now{transform:scale(1.25)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,7.4vw,34px);line-height:1.45;margin:12px 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;min-height:24px}

.arena{position:relative;height:320px;margin-top:8px;touch-action:none}
.opt{
  font-family:var(--body);font-size:17px;font-weight:600;
  padding:10px 20px;border-radius:16px;border:2.5px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap;
  box-shadow:0 4px 0 var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;
  transition:transform .15s, box-shadow .15s, background .2s;
}
.arena .opt{position:absolute;transition:left .3s cubic-bezier(.3,1.5,.5,1),top .3s cubic-bezier(.3,1.5,.5,1),transform .25s}
.opt.yes{background:var(--berry);color:#fff;transform:scale(var(--s,1));z-index:2}
.opt.yes:hover{transform:scale(calc(var(--s,1) * 1.06))}
.opt.yes:active,.choices .opt:active{box-shadow:0 1px 0 var(--ink);transform:translateY(3px)}
.opt:focus-visible{outline:3px dashed var(--berry);outline-offset:4px}
.opt.no{background:var(--blush-2)}
.arena .opt.no{white-space:normal;max-width:min(220px,46%);line-height:1.4}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;padding-bottom:6px}
.choices .opt{white-space:normal;padding:14px 10px;min-height:58px}
.choices .opt:hover{transform:translateY(-2px) rotate(-1deg);box-shadow:0 6px 0 var(--ink)}
.choices .opt.picked{background:var(--butter)}
.choices .opt:last-child:nth-child(odd){grid-column:1 / -1}
.choices.two .opt{font-size:22px;font-family:var(--display);min-height:84px}

/* ---------- final coupon ---------- */
.final h1{color:var(--berry)}
.coupon{
  position:relative;margin:20px 4px 8px;padding:16px 20px 10px;text-align:right;
  background:var(--blush);border:2.5px dashed var(--ink);border-radius:18px;
}
.coupon-head{font-family:var(--display);font-size:15px;color:var(--muted);text-align:center;margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:2px dotted rgba(91,18,53,.2);font-size:15px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{font-family:var(--display);font-size:19px;color:var(--ink)}
.stamp{
  position:absolute;top:-24px;left:-14px;width:84px;height:84px;border-radius:50%;
  border:3px solid var(--berry);color:var(--berry);background:var(--paper);
  display:grid;place-items:center;font-family:var(--display);font-size:18px;rotate:-16deg;
  box-shadow:0 0 0 4px var(--paper) inset, 0 0 0 6px var(--berry) inset;
}
.final.show .stamp{animation:stamp .5s .4s cubic-bezier(.2,1.8,.4,1) both}
@keyframes stamp{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
.from{font-family:var(--display);font-size:19px;margin-top:14px}
.from b{color:var(--berry)}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{font-family:var(--body);font-weight:600;font-size:16px;padding:10px 18px;border-radius:14px;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn.main{background:var(--berry);color:#fff}
.btn:active{box-shadow:0 1px 0 var(--ink);transform:translateY(3px)}
.btn:focus-visible{outline:3px dashed var(--berry);outline-offset:4px}
#copyArea{width:100%;margin-top:12px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:10px;font-family:var(--body);font-size:14px;resize:none}

.bubble-wrap{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(255,227,236,.8);border-radius:23px}
.bubble{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--berry);padding:20px 18px 18px;max-width:100%;animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
.bubble p{font-family:var(--display);font-size:clamp(20px,5.6vw,24px);line-height:1.6;margin:0;text-wrap:balance}
.bubble .actions{margin-top:14px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.count{margin-top:14px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--berry);font-family:var(--display);font-weight:600}
.scratch{position:relative;margin:18px 4px 0;border:2.5px solid var(--ink);border-radius:16px;background:var(--paper);min-height:120px;display:grid;place-items:center;padding:18px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.scratch p{white-space:pre-line;font-family:var(--display);font-size:clamp(17px,4.8vw,20px);line-height:1.9;margin:0;color:var(--berry);text-wrap:balance}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .7s}
.scratch canvas.gone{opacity:0;pointer-events:none}
.meter{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px auto 0;max-width:280px;font-size:13px;color:var(--muted)}
.meter span{white-space:nowrap;font-variant-numeric:tabular-nums}
.meter-bar{flex:1;height:10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.meter-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--berry) 0 6px,#e8558a 6px 12px);transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.meter-bar.over{animation:shake .5s 3}
.music{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);color:var(--berry);
  font-size:22px;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--ink);animation:wiggle 2s ease-in-out infinite}
.music.off{color:var(--muted);animation:none}
.music.off::after{content:"";position:absolute;inset:50% 6px auto;height:2.5px;background:var(--ink);rotate:-40deg}
.music:focus-visible{outline:3px dashed var(--berry);outline-offset:4px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn.wa{background:#25a35a;color:#fff}
@media (prefers-reduced-motion:reduce){
  .bubble,.shake,.music,.meter-bar.over{animation:none}
  .envelope,.sticker{animation:none}
  .arena .opt,.env-flap{transition:none}
  .card.pop,.final.show .stamp{animation:none}
}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<button class="music" id="musicBtn" type="button" aria-label="إيقاف الموسيقى" hidden>♫</button>

<!-- heart shape reused -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><path id="h" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.3 2.4.7-1.2 2.1-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></defs>
</svg>

<div class="env-wrap" id="envWrap" dir="rtl">
  <p class="env-to">رسالة <b id="envName"></b></p>
  <button class="envelope" id="envBtn" type="button" aria-label="افتحي الرسالة">
    <span class="env-lines"></span>
    <span class="env-flap"></span>
    <span class="seal"><svg viewBox="0 0 24 24"><use href="#h" fill="#d6336c"/></svg></span>
  </button>
  <p class="env-hint">اضغطي على الظرف</p>
</div>

<main class="card" id="card" dir="rtl" hidden>
  <svg class="sticker a" viewBox="0 0 24 24" aria-hidden="true"><use href="#h" fill="#d6336c" stroke="#5b1235" stroke-width="1.6"/></svg>
  <svg class="sticker b" viewBox="0 0 24 24" aria-hidden="true"><use href="#h" fill="#ffd166" stroke="#5b1235" stroke-width="1.6"/></svg>

  <div class="to" id="toLine"></div>
  <div class="steps" id="steps"></div>
  <div class="meter"><span id="meterTxt"></span><div class="meter-bar"><i id="meterFill"></i></div></div>

  <section id="ask">
    <h1 id="q"></h1>
    <p class="sub" id="sub"></p>
    <div id="stage"></div>
  </section>

  <section class="final" id="final" hidden>
    <h1 id="finalTitle"></h1>
    <p class="sub">انحجزتِ لي رسمياً، والإلغاء غير وارد</p>
    <div class="coupon">
      <div class="stamp">مؤكَّد</div>
      <div class="coupon-head">قسيمة موعد</div>
      <div id="ticket"></div>
    </div>
    <div class="count" id="count"></div>
    <div class="scratch" id="scratch"><p id="secret"></p><canvas id="scratchCv" aria-label="امسحي لتكشفي الرسالة"></canvas></div>
    <div class="from" id="from"></div>
    <div class="actions">
      <a class="btn main wa" id="waBtn" href="#" target="_blank" rel="noopener">أرسلي ردّك بالواتساب</a>
      <button class="btn" id="copyBtn" type="button">انسخي الرد</button>
      <button class="btn" id="again" type="button">من جديد</button>
    </div>
    <textarea id="copyArea" rows="4" hidden readonly></textarea>
  </section>

function relBox(el){
  // use where the button is going, not where it is mid-animation
  const k = parseFloat(el.style.getPropertyValue("--s"))||1;
  const w0 = el.offsetWidth, h0 = el.offsetHeight, w = w0*k, h = h0*k;
  const x = parseFloat(el.style.left)||0, y = parseFloat(el.style.top)||0;
  return {x:x-(w-w0)/2, y:y-(h-h0)/2, w, h};
}
function overlap(a,b,p){return !(a.x+a.w+p<b.x||b.x+b.w+p<a.x||a.y+a.h+p<b.y||b.y+b.h+p<a.y)}

function flee(el){
  const s = CONFIG.steps[step];
  const list = el._taunts || s.noTaunts;
  if(list){ const k = +(el.dataset.n||0); el.textContent = list[k % list.length]; el.dataset.n = k+1; }
  tries++;
  sfx.boing();
  if(s.grow){
    const y = arena.querySelector(".yes");
    y.style.setProperty("--s", (1 + Math.min(tries,7)*0.09).toFixed(2));
  }
  const W = arena.clientWidth, H = arena.clientHeight;
  const w = el.offsetWidth, h = el.offsetHeight;
  const others = [...arena.children].filter(o=>o!==el).map(relBox);
  const cur = relBox(el);
  const free = [];
  let best = null, least = Infinity;
  for(let y=0;y<=H-h;y+=6) for(let x=0;x<=W-w;x+=6){
    const c = {x,y,w,h};
    let area = 0;
    for(const o of others){
      const ix = Math.max(0, Math.min(c.x+w+10, o.x+o.w) - Math.max(c.x-10, o.x));
      const iy = Math.max(0, Math.min(c.y+h+10, o.y+o.h) - Math.max(c.y-10, o.y));
      area += ix*iy;
    }
    if(area===0) free.push(c);
    else if(area<least){ least=area; best=c; }
  }
  if(free.length){
    const far = free.filter(c=>Math.hypot(c.x-cur.x,c.y-cur.y) > Math.min(W,H)*.3);
    const pool = far.length ? far : free;
    best = pool[Math.floor(Math.random()*pool.length)];
  }
  if(!best) best = {x:0,y:0};
  el.style.left = best.x+"px"; el.style.top = best.y+"px";
}

function render(){
  const s = CONFIG.steps[step];

        if(re && re.reject){

        next(t);
      });

    });

  }

  arena = document.createElement("div");

  arena.style.height = ((s.order||s.no).length > 4 ? 430 : 320) + "px";
  stage.appendChild(arena);
  const yesList = [].concat(s.yes);
  let opts;
  if(s.order){
    opts = s.order.map(t=>({t, yes:yesList.includes(t), taunts:(s.taunts||{})[t]}));
  } else {
    opts = [...yesList.map(t=>({t,yes:true})), ...s.no.map(t=>({t,yes:false}))];
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
  }
  const els = opts.map((o,i)=>{
    const b = document.createElement("button");
    b.type="button"; b.className="opt "+(o.yes?"yes":"no"); b.textContent=o.t; b.id="pick-"+step+"-"+i;
    if(o.taunts) b._taunts = o.taunts;
    arena.appendChild(b);
    if(o.yes){
      b.addEventListener("click", async ()=>{
        const r = b.getBoundingClientRect();
        floatBurst(r.left+r.width/2, r.top+r.height/2, 14);
        if(step===0){
          const msg = tries>=4 ? "أخيراً! تعبتيني وأنا أحاول 😅" : tries>=1 ? "شفتِ؟ الزر الثاني كان مفبرك 😏" : "كنت أدري 😎";
          await say(msg, [{t:"هههه يلا", v:1, main:true}]);
        } else if(s.reactions && s.reactions[o.t]){
          await say(s.reactions[o.t].msg, [{t:"يلا", v:1, main:true}]);
        }
        next(o.t);
      });
    } else {
      b.tabIndex = -1;
      const run = e=>{ e.preventDefault(); flee(b); };
      b.addEventListener("pointerenter", e=>{ if(e.pointerType==="mouse") run(e); });
      b.addEventListener("pointerdown", run);
      b.addEventListener("click", run);
    }
    return b;
  });
  const W = arena.clientWidth, H = arena.clientHeight, gap = 14;
  const cols = els.length>4 ? 2 : 1, rows = Math.ceil(els.length/cols);
  const rh = Math.max(...els.map(b=>b.offsetHeight));
  const y0 = Math.max(0,(H-(rows*rh+gap*(rows-1)))/2);
  els.forEach((b,k)=>{
    const r = Math.floor(k/cols), c = k%cols;
    const lone = cols===2 && k===els.length-1 && els.length%2===1;
    const cx = (cols===1||lone) ? W/2 : (c===0 ? W*.73 : W*.27);
    b.style.left = Math.max(0,Math.min(W-b.offsetWidth, cx-b.offsetWidth/2))+"px";
    b.style.top = (y0 + r*(rh+gap))+"px";
  });
}

const DAYS = {"الأحد":0,"الاثنين":1,"الثلاثاء":2,"الأربعاء":3,"الخميس":4,"الجمعة":5,"السبت":6};
const toLatin = s => s.replace(/[٠-٩]/g, d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const toArabic = n => String(n).replace(/\d/g, d=>"٠١٢٣٤٥٦٧٨٩"[d]);
let timer = null;
function countdown(){
  const day = answers.find(a=>a.label==="اليوم"), time = answers.find(a=>a.label==="الوقت");
  if(!day || !time || !(day.value in DAYS)) return;
  let h = parseInt(toLatin(time.value),10); if(h<12) h+=12;
  const now = new Date(), t = new Date(now);
  t.setHours(h,0,0,0);
  let add = (DAYS[day.value] - now.getDay() + 7) % 7;
  if(add===0 && t<=now) add = 7;
  t.setDate(t.getDate()+add);
  const tick = ()=>{
    let m = Math.max(0, Math.round((t-new Date())/60000));
    const d = Math.floor(m/1440); m-=d*1440; const hh = Math.floor(m/60); m-=hh*60;
    const parts = [];
    if(d) parts.push(toArabic(d)+(d===1?" يوم":d===2?" يومين":d<11?" أيام":" يوم"));
    parts.push(toArabic(hh)+" ساعة");
    parts.push(toArabic(m)+" دقيقة");
    $("count").innerHTML = "باقي على موعدنا <b>"+parts.join(" و ")+"</b>";
  };
  tick(); clearInterval(timer); timer = setInterval(tick, 30000);
}

function setupScratch(){

  c.globalCompositeOperation="source-over";
  const g=c.createLinearGradient(0,0,r.width,r.height);
  g.addColorStop(0,"#d6336c"); g.addColorStop(1,"#ff8fab");
  c.fillStyle=g; c.fillRect(0,0,r.width,r.height);
  c.fillStyle="rgba(255,255,255,.22)";
  for(let y=14;y<r.height;y+=26) for(let x=(y/26%2)*13+10;x<r.width;x+=26){ c.beginPath(); c.arc(x,y,3,0,6.283); c.fill(); }
  c.fillStyle="#fff"; c.font="700 20px Marhey, sans-serif"; c.textAlign="center"; c.textBaseline="middle"; c.direction="rtl";
  c.fillText("امسحي هنا بإصبعك", r.width/2, r.height/2-8);
  c.font="400 14px 'Baloo Bhaijaan 2', sans-serif";
  c.fillText("فيه رسالة مخبّاة لك", r.width/2, r.height/2+18);
  c.globalCompositeOperation="destination-out";
  c.lineWidth=38; c.lineCap="round"; c.lineJoin="round";
  let down=false, last=null, done=false;
  const pt=e=>{const b=sc.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}};
  const draw=p=>{ c.beginPath(); const a=last||p; c.moveTo(a.x,a.y); c.lineTo(p.x+.1,p.y); c.stroke(); last=p; };
  function check(){
    if(done) return;
    const data=c.getImageData(0,0,sc.width,sc.height).data; let clear=0,n=0;
    for(let k=3;k<data.length;k+=64){ n++; if(data[k]<40) clear++; }
    if(clear/n>.5){
      done=true; sc.classList.add("gone");
      const b=box.getBoundingClientRect(); floatBurst(b.left+b.width/2,b.top+b.height/2,30);
    }
  }
  sc.onpointerdown=e=>{ down=true; last=null; try{sc.setPointerCapture(e.pointerId)}catch(_){} draw(pt(e)); };
  sc.onpointermove=e=>{ if(down) draw(pt(e)); };
  sc.onpointerup=sc.onpointercancel=()=>{ down=false; last=null; check(); };
}

/* ---------- hearts in the background ---------- */
const cv=$("sky"), cx=cv.getContext("2d");
let floaters=[], pops=[];
const COLS=["#d6336c","#ff8fab","#ffd166","#ffffff"];
function size(){
  const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; cx.setTransform(d,0,0,d,0,0);
}
function heart(x,y,s,rot){
  cx.save(); cx.translate(x,y); cx.rotate(rot||0); cx.scale(s/24,s/24); cx.translate(-12,-12);
  cx.beginPath();
  cx.moveTo(12,21); cx.bezierCurveTo(12,21,4.5,16.4,2.4,11.8);
  cx.bezierCurveTo(.9,8.4,3,4.5,6.7,4.5); cx.bezierCurveTo(8.9,4.5,10.3,5.7,11,6.9);
  cx.bezierCurveTo(11.7,5.7,13.1,4.5,15.3,4.5); cx.bezierCurveTo(19,4.5,21.1,8.4,19.6,11.8);
  cx.bezierCurveTo(17.5,16.4,12,21,12,21); cx.fill(); cx.restore();
}
for(let i=0;i<18;i++) floaters.push(newFloater(true));
function newFloater(anywhere){
  return {x:Math.random()*innerWidth, y:anywhere?Math.random()*innerHeight:innerHeight+30,
          s:Math.random()*16+10, v:Math.random()*.5+.3, w:Math.random()*6.28,
          c:COLS[Math.floor(Math.random()*3)], a:Math.random()*.35+.25};
}
function floatBurst(x,y,n){
  if(reduce) return;
  for(let i=0;i<n;i++){const ang=Math.random()*6.28,sp=Math.random()*5+2;
    pops.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-2,s:Math.random()*10+8,c:COLS[i%4],life:1,r:Math.random()-.5});}
}
function bigBurst(){
  if(reduce) return;
  floatBurst(innerWidth*.25, innerHeight*.4, 30);
  floatBurst(innerWidth*.75, innerHeight*.4, 30);
  setTimeout(()=>floatBurst(innerWidth*.5, innerHeight*.3, 40), 300);
}
function frame(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(const f of floaters){
    if(!reduce){ f.y-=f.v; f.w+=.015; }
    if(f.y<-30) Object.assign(f,newFloater(false));
    cx.globalAlpha=f.a; cx.fillStyle=f.c; heart(f.x+Math.sin(f.w)*16, f.y, f.s, Math.sin(f.w)*.3);
  }
  for(const p of pops){
    p.x+=p.vx; p.y+=p.vy; p.vy+=.15; p.life-=.012;
    cx.globalAlpha=Math.max(p.life,0); cx.fillStyle=p.c; heart(p.x,p.y,p.s,p.r);
  }
  pops=pops.filter(p=>p.life>0);
  cx.globalAlpha=1;
  requestAnimationFrame(frame);
}

const music = (()=>{
  let ctx=null, master=null, on=false, t0=0, i=0, timer=null, buffers={}, ready=null;
  const SM={C:0,Cs:1,D:2,Ds:3,E:4,F:5,Fs:6,G:7,Gs:8,A:9,As:10,B:11};
  const toMidi=k=>{const m=k.match(/^([A-G]s?)(\d)$/);return 12*(+m[2]+1)+SM[m[1]]};
  const N=n=>{const m=n.match(/^([A-G])(#|b)?(\d)$/);return 12*(+m[3]+1)+SM[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0)};
  function init(){
    if(ready) return ready;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=.0001;
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
    master.connect(comp); comp.connect(ctx.destination);
    ready=Promise.all(Object.entries(PIANO).map(([k,b64])=>{
      const bin=atob(b64), u=new Uint8Array(bin.length);
      for(let j=0;j<bin.length;j++) u[j]=bin.charCodeAt(j);
      return new Promise(res=>ctx.decodeAudioData(u.buffer,buf=>{buffers[toMidi(k)]=buf;res()},()=>res()));
    }));
    return ready;
  }
  function note(m,at,vel,len){
    const keys=Object.keys(buffers).map(Number); if(!keys.length) return;
    let best=keys[0]; for(const k of keys) if(Math.abs(k-m)<Math.abs(best-m)) best=k;
    const src=ctx.createBufferSource(), g=ctx.createGain();
    src.buffer=buffers[best]; src.playbackRate.value=Math.pow(2,(m-best)/12);
    g.gain.setValueAtTime(vel,at);
    g.gain.setValueAtTime(vel,at+len);
    g.gain.exponentialRampToValueAtTime(.0001,at+len+.9);
    src.connect(g); g.connect(master); src.start(at); src.stop(at+len+1);
  }
  // 8 bars of 4 beats; bass + broken chord, melody on top
  const C=(b,t)=>({b:N(b),t:t.map(N)});
  const PROG_A=[C("F2",["F3","A3","C4"]),C("E2",["G3","C4","E4"]),C("D2",["F3","A3","D4"]),C("Bb2",["F3","Bb3","D4"]),
                C("A2",["F3","A3","C4"]),C("G2",["F3","Bb3","D4"]),C("C3",["F3","G3","C4"]),C("C3",["E3","G3","C4"])];
  const PROG_B=PROG_A.slice(0,7).concat([C("F2",["F3","A3","C4"])]);
  const M=arr=>arr.map(([n,d])=>[n?N(n):null,d]);
  const MEL_A=M([["A4",2],["G4",1],["F4",1], ["G4",3],["E4",1], ["F4",1],["A4",1],["D5",1],["C5",1], ["D5",2],["C5",1],["Bb4",1],
                 ["A4",2],["C5",1],["A4",1], ["Bb4",1],["A4",1],["G4",1],["F4",1], ["G4",3],["C5",1], ["G4",4]]);
  const MEL_B=M([["C5",2],["A4",1],["C5",1], ["D5",1],["C5",2],["G4",1], ["A4",1],["D5",1],["F5",1],["E5",1], ["D5",2],["F5",1],["D5",1],
                 ["C5",2],["A4",1],["F4",1], ["G4",1],["Bb4",1],["D5",1],["C5",1], ["C5",1],["Bb4",1],["A4",1],["G4",1], ["F4",4]]);
  const PLAN=[[PROG_A,null],[PROG_A,MEL_A],[PROG_B,MEL_B],[PROG_A,MEL_A],[PROG_B,MEL_B]];
  const ARP=[0,1,2,1,0,1,2,1];
  const beat=60/64;
  let events=[], cyc=-1;
  function buildCycle(){
    cyc++;
    events=[];
    const [prog,mel]=PLAN[cyc<PLAN.length?cyc:1+((cyc-1)%(PLAN.length-1))];
    prog.forEach((ch,bar)=>{
      const base=bar*4;
      events.push({b:base,m:ch.b,v:.5,l:4*beat});
      ARP.forEach((k,j)=>events.push({b:base+j*.5,m:ch.t[k],v:j%4===0?.24:.17,l:1.4*beat}));
    });
    if(mel){ let b=0; for(const [m,d] of mel){ if(m) events.push({b,m,v:.52,l:Math.max(d,.8)*beat}); b+=d; } }
    events.sort((x,y)=>x.b-y.b); i=0;
  }
  let cycStart=0;
  function schedule(){
    while(true){
      if(i>=events.length){ cycStart+=32*beat; buildCycle(); }
      const e=events[i], at=cycStart+e.b*beat;
      if(at>ctx.currentTime+.3) break;
      if(at>=ctx.currentTime-.05) note(e.m,at,e.v,e.l);
      i++;
    }
  }
  async function start(){
    try{
      init(); await ctx.resume(); await ready;
      on=true;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
      master.gain.linearRampToValueAtTime(.9,ctx.currentTime+1.2);
      if(cyc<0){ cycStart=ctx.currentTime+.15; buildCycle(); }
      else { cycStart=ctx.currentTime+.15; cyc=0; buildCycle(); }
      clearInterval(timer); timer=setInterval(schedule,80);
      $("musicBtn").hidden=false; $("musicBtn").classList.remove("off");
      $("musicBtn").setAttribute("aria-label","إيقاف الموسيقى");
    }catch(_){}
  }
  function stop(){
    on=false; clearInterval(timer);
    if(ctx){ master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value,ctx.currentTime); master.gain.linearRampToValueAtTime(.0001,ctx.currentTime+.4); }
    $("musicBtn").classList.add("off");
    $("musicBtn").setAttribute("aria-label","تشغيل الموسيقى");
  }
  $("musicBtn").addEventListener("click", e=>{ e.stopPropagation(); on ? stop() : start(); });
  try{ init(); }catch(_){}
  return {start, get ctx(){return ctx}, get on(){return on},
          play:(n,v,l)=>{ if(ctx&&on) note(N(n),ctx.currentTime,v,l); }};
})();

const sfx = {
  boing(){
    const c=music.ctx; if(!c||!music.on) return;
    const o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
    o.type="triangle"; o.frequency.setValueAtTime(260,t); o.frequency.exponentialRampToValueAtTime(820,t+.12);
    o.frequency.exponentialRampToValueAtTime(420,t+.22);
    g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.0001,t+.25);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.3);
  },
  fanfare(){ ["D5","F#5","A5","D6"].forEach((n,k)=>setTimeout(()=>music.play(n,.55,1),k*150)); }
};

size(); requestAnimationFrame(frame);
</script>
